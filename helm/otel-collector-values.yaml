# OpenTelemetry Collector — gateway for Project 3.
# Daemonset so it can tail each node's container logs (pino JSON) via filelog.
mode: daemonset

fullnameOverride: otel-collector

image:
  repository: otel/opentelemetry-collector-k8s

service:
  enabled: true

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  kubernetesAttributes:
    enabled: true

# Export logs -> Loki, traces -> Tempo, metrics -> Mimir.
config:
  exporters:
    # Loki accepts OTLP natively on its HTTP port at /otlp.
    # X-Scope-OrgID is required — Loki is multi-tenant and rejects with 401 without it.
    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
      headers:
        X-Scope-OrgID: anonymous
    # Tempo accepts OTLP gRPC on 4317.
    otlp/tempo:
      endpoint: http://tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true
    # Mimir accepts OTLP over HTTP on the distributor at /otlp.
    # X-Scope-OrgID is required because Mimir is multi-tenant by default.
    otlphttp/mimir:
      endpoint: http://mimir-distributor.observability.svc.cluster.local:8080/otlp
      headers:
        X-Scope-OrgID: anonymous

  processors:
    batch: {}

  service:
    pipelines:
      logs:
        exporters:
          - otlphttp/loki
      traces:
        exporters:
          - otlp/tempo
      metrics:
        exporters:
          - otlphttp/mimir
