# Grafana Loki — logs backend for Project 3 (monolithic, S3-backed).
loki:
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true   # required for OTLP ingestion
    volume_enabled: true
  ruler:
    enable_api: true

  # S3 via Pod Identity — no static keys; the AWS SDK uses the bound IAM role.
  storage:
    type: s3
    bucketNames:
      chunks: taskflow-obs-loki-713923090919
      ruler: taskflow-obs-loki-713923090919
      admin: taskflow-obs-loki-713923090919
    s3:
      region: us-east-1

# Bind to the SA that Phase 1 associated with the Loki IAM role.
serviceAccount:
  create: true
  name: loki

# Use real S3, not the built-in MinIO.
minio:
  enabled: false

deploymentMode: Monolithic

singleBinary:
  replicas: 1
  persistence:
    enabled: false   # cluster is disposable; durable data lives in S3

# Trim optional components to keep the footprint lean.
gateway:
  enabled: false
lokiCanary:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# The Helm test hook depends on the canary; disable it since the canary is off.
test:
  enabled: false

# Zero out replica counts of all other deployment modes.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
