# Grafana Mimir — metrics backend for Project 3.
# Minimal classic architecture; ruler enabled for SLO burn-rate alerts.

serviceAccount:
  create: true
  name: mimir

mimir:
  structuredConfig:
    common:
      storage:
        backend: s3
        s3:
          endpoint: s3.us-east-1.amazonaws.com
          region: us-east-1
          bucket_name: taskflow-obs-mimir-713923090919
    ingester:
      ring:
        replication_factor: 1
      push_grpc_method_enabled: true
    ingest_storage:
      enabled: false
    limits:
      out_of_order_time_window: 10m
    # Ruler stores its rule groups in S3 (same bucket, separate prefix).
    ruler_storage:
      backend: s3
      s3:
        bucket_name: taskflow-obs-mimir-713923090919
      storage_prefix: ruler
    # Ruler sends fired alerts to standalone Alertmanager.
    ruler:
      alertmanager_url: http://alertmanager.observability.svc.cluster.local:9093

kafka:
  enabled: false

distributor:
  replicas: 1

ingester:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  persistentVolume:
    enabled: false

querier:
  replicas: 1

query_frontend:
  replicas: 1

query_scheduler:
  replicas: 1

store_gateway:
  replicas: 1
  zoneAwareReplication:
    enabled: false
  persistentVolume:
    enabled: false

compactor:
  persistentVolume:
    enabled: false

# Ruler ON now; others stay off.
ruler:
  enabled: true

alertmanager:
  enabled: false
overrides_exporter:
  enabled: false
gateway:
  enabled: false
minio:
  enabled: false

chunks-cache:
  enabled: false
index-cache:
  enabled: false
metadata-cache:
  enabled: false
results-cache:
  enabled: false
