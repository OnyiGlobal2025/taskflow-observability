# Prometheus Alertmanager — Project 3.
# Secrets read from mounted files (api_url_file / auth_password_file),
# sourced from the 'alertmanager-secrets' Kubernetes secret. No env expansion.
persistence:
  enabled: false

extraSecretMounts:
  - name: alertmanager-secrets
    secretName: alertmanager-secrets
    mountPath: /etc/secrets
    readOnly: true

config:
  enabled: true
  global:
    resolve_timeout: 5m
    smtp_smarthost: 'smtp.gmail.com:587'
    smtp_from: 'onyedikaokoro8@gmail.com'
    smtp_auth_username: 'onyedikaokoro8@gmail.com'
    smtp_auth_password_file: '/etc/secrets/smtp_password'
    smtp_require_tls: true

  route:
    receiver: 'default'
    group_by: ['alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: 'critical'
        matchers:
          - severity="critical"

  receivers:
    - name: 'default'
      slack_configs:
        - api_url_file: '/etc/secrets/slack_webhook_url'
          channel: '#alerts'
          title: '{{ .CommonLabels.alertname }}'
          text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
    - name: 'critical'
      slack_configs:
        - api_url_file: '/etc/secrets/slack_webhook_url'
          channel: '#alerts'
          title: 'CRITICAL: {{ .CommonLabels.alertname }}'
          text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
      email_configs:
        - to: 'onyedikaokoro8@gmail.com'
          send_resolved: true
