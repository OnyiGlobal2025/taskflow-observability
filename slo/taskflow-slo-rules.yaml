namespace: taskflow
groups:
  # --- Recording rules: error ratio over multiple windows ---
  - name: taskflow-slo-error-rates
    rules:
      - record: job:http_request_error_rate:ratio_rate5m
        expr: |
          sum(rate(http_server_request_duration_seconds_count{job="taskflow/taskflow-backend", http_response_status_code=~"5.."}[5m]))
          /
          sum(rate(http_server_request_duration_seconds_count{job="taskflow/taskflow-backend"}[5m]))
      - record: job:http_request_error_rate:ratio_rate1h
        expr: |
          sum(rate(http_server_request_duration_seconds_count{job="taskflow/taskflow-backend", http_response_status_code=~"5.."}[1h]))
          /
          sum(rate(http_server_request_duration_seconds_count{job="taskflow/taskflow-backend"}[1h]))

  # --- Alerting rules: multi-window burn-rate against a 99% SLO ---
  - name: taskflow-slo-burn-rate
    rules:
      # Fast burn: 14.4x budget over 5m AND 1h -> page immediately.
      - alert: TaskflowHighErrorBurnRateFast
        expr: |
          job:http_request_error_rate:ratio_rate5m > (14.4 * 0.01)
          and
          job:http_request_error_rate:ratio_rate1h > (14.4 * 0.01)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Taskflow burning error budget fast (>14.4x) — 99% SLO at risk"

      # Slow burn: 3x budget over 1h -> warn.
      - alert: TaskflowHighErrorBurnRateSlow
        expr: |
          job:http_request_error_rate:ratio_rate1h > (3 * 0.01)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Taskflow burning error budget slowly (>3x) — investigate"
